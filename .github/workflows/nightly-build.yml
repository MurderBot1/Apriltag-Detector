name: Nightly Build

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
          - RelWithDebInfo
          - MinSizeRel

concurrency:
  group: nightly-build
  cancel-in-progress: true

env:
  BUILD_CONFIG: ${{ github.event.inputs.build_config || 'Release' }}

jobs:
  # Nightly build for Linux platforms
  nightly-build:
    name: Nightly Build - Linux Platforms
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - linux-arm
        include:
          # Linux x64 (native)
          - platform: linux-x64
            target: linux
            arch: x64
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git"
            
          # Linux ARM64 (cross-compile)
          - platform: linux-arm64
            target: linux
            arch: arm64
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
            
          # Linux ARM (cross-compile)
          - platform: linux-arm
            target: linux
            arch: arm
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: ${{ matrix.install_deps }}

      - name: Configure CMake
        run: |
          BUILD_DIR="build/nightly/${{ matrix.platform }}_${{ env.BUILD_CONFIG }}"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          
          case "${{ matrix.platform }}" in
            linux-x64)
              cmake $GITHUB_WORKSPACE \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=linux \
                -DCMAKE_SYSTEM_PROCESSOR=x86_64
              ;;
            linux-arm64)
              export CC=aarch64-linux-gnu-gcc
              export CXX=aarch64-linux-gnu-g++
              cmake $GITHUB_WORKSPACE \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_CXX_FLAGS="-march=armv8-a" \
                -DCMAKE_C_FLAGS="-march=armv8-a"
              ;;
            linux-arm)
              export CC=arm-linux-gnueabihf-gcc
              export CXX=arm-linux-gnueabihf-g++
              cmake $GITHUB_WORKSPACE \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=linux \
                -DCMAKE_SYSTEM_PROCESSOR=arm \
                -DCMAKE_CXX_FLAGS="-march=armv7-a -mfpu=neon -mfloat-abi=hard" \
                -DCMAKE_C_FLAGS="-march=armv7-a -mfpu=neon -mfloat-abi=hard"
              ;;
          esac

      - name: Build
        run: |
          BUILD_DIR="build/nightly/${{ matrix.platform }}_${{ env.BUILD_CONFIG }}"
          cd "$BUILD_DIR"
          cmake --build . --config ${{ env.BUILD_CONFIG }} --parallel $(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}-${{ env.BUILD_CONFIG }}
          path: build/nightly/${{ matrix.platform }}_${{ env.BUILD_CONFIG }}
          retention-days: 30


  # Windows builds (separate job due to different toolchain)
  nightly-windows:
    name: Nightly Build - Windows Platforms
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-x64
          - windows-arm64
        include:
          - platform: windows-x64
            arch: x64
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git mingw-w64"
          - platform: windows-arm64
            arch: arm64
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git mingw-w64"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: ${{ matrix.install_deps }}

      - name: Configure CMake
        run: |
          BUILD_DIR="build/nightly/${{ matrix.platform }}_${{ env.BUILD_CONFIG }}"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          
          case "${{ matrix.platform }}" in
            windows-x64)
              export CC=x86_64-w64-mingw32-gcc
              export CXX=x86_64-w64-mingw32-g++
              export RC=x86_64-w64-mingw32-windres
              cmake $GITHUB_WORKSPACE \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=windows \
                -DCMAKE_SYSTEM_NAME=Windows
              ;;
            windows-arm64)
              export CC=aarch64-w64-mingw32-gcc
              export CXX=aarch64-w64-mingw32-g++
              export RC=aarch64-w64-mingw32-windres
              cmake $GITHUB_WORKSPACE \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=windows \
                -DCMAKE_SYSTEM_NAME=Windows
              ;;
          esac

      - name: Build
        run: |
          BUILD_DIR="build/nightly/${{ matrix.platform }}_${{ env.BUILD_CONFIG }}"
          cd "$BUILD_DIR"
          cmake --build . --config ${{ env.BUILD_CONFIG }} --parallel $(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}-${{ env.BUILD_CONFIG }}
          path: build/nightly/${{ matrix.platform }}_${{ env.BUILD_CONFIG }}
          retention-days: 30


  # macOS builds (separate jobs due to different runners)
  nightly-macos-x64:
    name: Nightly Build - macOS x64
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake

      - name: Configure CMake
        run: |
          BUILD_DIR="build/nightly/macos_x64_${{ env.BUILD_CONFIG }}"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          cmake $GITHUB_WORKSPACE \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
            -DPLATFORM=macos \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build
        run: |
          BUILD_DIR="build/nightly/macos_x64_${{ env.BUILD_CONFIG }}"
          cd "$BUILD_DIR"
          cmake --build . --config ${{ env.BUILD_CONFIG }} --parallel $(sysctl -n hw.ncpu)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos-x64-${{ env.BUILD_CONFIG }}
          path: build/nightly/macos_x64_${{ env.BUILD_CONFIG }}
          retention-days: 30


  nightly-macos-arm64:
    name: Nightly Build - macOS ARM64
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake

      - name: Configure CMake
        run: |
          BUILD_DIR="build/nightly/macos_arm64_${{ env.BUILD_CONFIG }}"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          cmake $GITHUB_WORKSPACE \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
            -DPLATFORM=macos \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_APPLE_SILICON_PROCESSOR=arm64

      - name: Build
        run: |
          BUILD_DIR="build/nightly/macos_arm64_${{ env.BUILD_CONFIG }}"
          cd "$BUILD_DIR"
          cmake --build . --config ${{ env.BUILD_CONFIG }} --parallel $(sysctl -n hw.ncpu)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos-arm64-${{ env.BUILD_CONFIG }}
          path: build/nightly/macos_arm64_${{ env.BUILD_CONFIG }}
          retention-days: 30


  # Summary job
  nightly-summary:
    name: Nightly Build Summary
    needs:
      - nightly-build
      - nightly-windows
      - nightly-macos-x64
      - nightly-macos-arm64
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: nightly-artifacts
          merge-multiple: false

      - name: Generate nightly report
        run: |
          echo "# Nightly Build Report" > nightly_report.md
          echo "" >> nightly_report.md
          echo "**Date:** $(date -u)" >> nightly_report.md
          echo "**Build Configuration:** ${{ env.BUILD_CONFIG }}" >> nightly_report.md
          echo "**Commit:** ${{ github.sha }}" >> nightly_report.md
          echo "" >> nightly_report.md
          echo "## Build Results" >> nightly_report.md
          echo "" >> nightly_report.md
          
          PLATFORMS=("linux-x64" "linux-arm64" "linux-arm" "windows-x64" "windows-arm64" "macos-x64" "macos-arm64")
          
          for platform in "${PLATFORMS[@]}"; do
            if [ -d "nightly-artifacts/nightly-${platform}-${{ env.BUILD_CONFIG }}" ]; then
              echo "✅ **${platform}**: Success" >> nightly_report.md
            else
              echo "❌ **${platform}**: Failed or Skipped" >> nightly_report.md
            fi
          done
          
          echo "" >> nightly_report.md
          echo "## Notes" >> nightly_report.md
          echo "" >> nightly_report.md
          echo "- All artifacts are retained for 30 days" >> nightly_report.md
          echo "- Nightly builds run automatically at 2 AM UTC" >> nightly_report.md
          echo "- Manual triggering available via GitHub Actions" >> nightly_report.md
          
          cat nightly_report.md

      - name: Upload nightly report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: nightly_report.md
          retention-days: 30

      - name: Create GitHub Issue for failures (if any)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('nightly_report.md', 'utf8');
            
            // Check if there are failures
            const hasFailures = report.includes('❌');
            
            if (hasFailures) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ Nightly Build Failures - ${new Date().toISOString().split('T')[0]}`,
                body: report + '\n\n**Action Required:** Please investigate the build failures.',
                labels: ['bug', 'build', 'nightly']
              });
            }
