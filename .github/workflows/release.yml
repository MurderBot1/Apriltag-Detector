name: Release Build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_CONFIG: Release

jobs:
  # Build all platforms for release
  build-release:
    name: Release Build - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - linux-arm
          - windows-x64
          - windows-arm64
        include:
          # Linux x64
          - platform: linux-x64
            os: ubuntu-22.04
            target: linux
            arch: x64
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git"
            
          # Linux ARM64
          - platform: linux-arm64
            os: ubuntu-22.04
            target: linux
            arch: arm64
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
            
          # Linux ARM
          - platform: linux-arm
            os: ubuntu-22.04
            target: linux
            arch: arm
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
            
          # Windows x64
          - platform: windows-x64
            os: ubuntu-22.04
            target: windows
            arch: x64
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git mingw-w64"
            
          # Windows ARM64
          - platform: windows-arm64
            os: ubuntu-22.04
            target: windows
            arch: arm64
            install_deps: "sudo apt update && sudo apt install -y build-essential cmake git mingw-w64"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: ${{ matrix.install_deps }}

      - name: Configure CMake
        run: |
          BUILD_DIR="build/release/${{ matrix.platform }}"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          
          case "${{ matrix.platform }}" in
            linux-x64)
              cmake .. \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=linux \
                -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
                -DCMAKE_INSTALL_PREFIX=install
              ;;
            linux-arm64)
              cmake .. \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_CXX_FLAGS="-march=armv8-a" \
                -DCMAKE_C_FLAGS="-march=armv8-a" \
                -DCMAKE_INSTALL_PREFIX=install
              ;;
            linux-arm)
              cmake .. \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=linux \
                -DCMAKE_SYSTEM_PROCESSOR=arm \
                -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
                -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
                -DCMAKE_CXX_FLAGS="-march=armv7-a -mfpu=neon -mfloat-abi=hard" \
                -DCMAKE_C_FLAGS="-march=armv7-a -mfpu=neon -mfloat-abi=hard" \
                -DCMAKE_INSTALL_PREFIX=install
              ;;
            windows-x64)
              cmake .. \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=windows \
                -DCMAKE_SYSTEM_NAME=Windows \
                -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
                -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
                -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
                -DCMAKE_INSTALL_PREFIX=install
              ;;
            windows-arm64)
              cmake .. \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
                -DPLATFORM=windows \
                -DCMAKE_SYSTEM_NAME=Windows \
                -DCMAKE_C_COMPILER=aarch64-w64-mingw32-gcc \
                -DCMAKE_CXX_COMPILER=aarch64-w64-mingw32-g++ \
                -DCMAKE_RC_COMPILER=aarch64-w64-mingw32-windres \
                -DCMAKE_INSTALL_PREFIX=install
              ;;
          esac

      - name: Build
        run: |
          BUILD_DIR="build/release/${{ matrix.platform }}"
          cd "$BUILD_DIR"
          cmake --build . --config ${{ env.BUILD_CONFIG }} --parallel $(nproc)

      - name: Install
        run: |
          BUILD_DIR="build/release/${{ matrix.platform }}"
          cd "$BUILD_DIR"
          cmake --install . --config ${{ env.BUILD_CONFIG }}

      - name: Create archive
        run: |
          BUILD_DIR="build/release/${{ matrix.platform }}"
          cd "$BUILD_DIR"
          
          # Create platform-specific archive name
          ARCHIVE_NAME="apriltag-detector-${{ github.ref_name }}-${{ matrix.platform }}"
          
          # Create tar.gz archive of install directory
          tar -czf "../../${ARCHIVE_NAME}.tar.gz" install
          
          # Move back to project root
          cd ../../..
          
          # List the created archive
          ls -lh "${ARCHIVE_NAME}.tar.gz"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: apriltag-detector-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          retention-days: 30


  # macOS builds
  build-macos-x64:
    name: Release Build - macOS x64
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake

      - name: Configure CMake
        run: |
          BUILD_DIR="build/release/macos-x64"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
            -DPLATFORM=macos \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: |
          BUILD_DIR="build/release/macos-x64"
          cd "$BUILD_DIR"
          cmake --build . --config ${{ env.BUILD_CONFIG }} --parallel $(sysctl -n hw.ncpu)

      - name: Install
        run: |
          BUILD_DIR="build/release/macos-x64"
          cd "$BUILD_DIR"
          cmake --install . --config ${{ env.BUILD_CONFIG }}

      - name: Create archive
        run: |
          BUILD_DIR="build/release/macos-x64"
          cd "$BUILD_DIR"
          ARCHIVE_NAME="apriltag-detector-${{ github.ref_name }}-macos-x64"
          tar -czf "../../${ARCHIVE_NAME}.tar.gz" install
          cd ../../..
          ls -lh "${ARCHIVE_NAME}.tar.gz"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: apriltag-detector-${{ github.ref_name }}-macos-x64.tar.gz
          retention-days: 30


  build-macos-arm64:
    name: Release Build - macOS ARM64
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake

      - name: Configure CMake
        run: |
          BUILD_DIR="build/release/macos-arm64"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
            -DPLATFORM=macos \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_APPLE_SILICON_PROCESSOR=arm64 \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: |
          BUILD_DIR="build/release/macos-arm64"
          cd "$BUILD_DIR"
          cmake --build . --config ${{ env.BUILD_CONFIG }} --parallel $(sysctl -n hw.ncpu)

      - name: Install
        run: |
          BUILD_DIR="build/release/macos-arm64"
          cd "$BUILD_DIR"
          cmake --install . --config ${{ env.BUILD_CONFIG }}

      - name: Create archive
        run: |
          BUILD_DIR="build/release/macos-arm64"
          cd "$BUILD_DIR"
          ARCHIVE_NAME="apriltag-detector-${{ github.ref_name }}-macos-arm64"
          tar -czf "../../${ARCHIVE_NAME}.tar.gz" install
          cd ../../..
          ls -lh "${ARCHIVE_NAME}.tar.gz"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: apriltag-detector-${{ github.ref_name }}-macos-arm64.tar.gz
          retention-days: 30


  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    needs:
      - build-release
      - build-macos-x64
      - build-macos-arm64
    runs-on: ubuntu-22.04
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          path: release-archives
          merge-multiple: true

      - name: List downloaded archives
        run: ls -lh release-archives/

      - name: Create release body
        run: |
          echo "# AprilTag Detector ${{ github.ref_name }}" > release_body.md
          echo "" >> release_body.md
          echo "Pre-built binaries for all supported platforms and architectures." >> release_body.md
          echo "" >> release_body.md
          echo "## Downloads" >> release_body.md
          echo "" >> release_body.md
          
          # List all platforms
          PLATFORMS=(
            "linux-x64:Linux x64" 
            "linux-arm64:Linux ARM64 (Raspberry Pi 4/5, etc.)" 
            "linux-arm:Linux ARM (32-bit)" 
            "windows-x64:Windows x64" 
            "windows-arm64:Windows ARM64" 
            "macos-x64:macOS Intel (x86_64)" 
            "macos-arm64:macOS Apple Silicon (M1/M2)"
          )
          
          for item in "${PLATFORMS[@]}"; do
            IFS=':' read -r platform name <<< "$item"
            archive="apriltag-detector-${{ github.ref_name }}-${platform}.tar.gz"
            if [ -f "release-archives/release-${platform}/${archive}" ]; then
              echo "- **${name}**: [Download](${archive})`" >> release_body.md
            fi
          done
          
          echo "" >> release_body.md
          echo "## Build Information" >> release_body.md
          echo "" >> release_body.md
          echo "- **Build Configuration:** ${{ env.BUILD_CONFIG }}" >> release_body.md
          echo "- **Commit:** ${{ github.sha }}" >> release_body.md
          echo "- **Build Date:** $(date -u)" >> release_body.md
          echo "" >> release_body.md
          echo "## Changelog" >> release_body.md
          echo "" >> release_body.md
          echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> release_body.md
          
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-archives/release-*/*.tar.gz
          name: AprilTag Detector ${{ github.ref_name }}
          body_file: release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # Cleanup (optional)
  cleanup:
    name: Cleanup Build Artifacts
    needs: create-release
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Remove release build directory
        run: |
          # Remove the build directory to save space
          # This is optional and can be commented out if you want to keep builds
          if [ -d "build/release" ]; then
            echo "Cleaning up release build directory..."
            rm -rf build/release
          fi
